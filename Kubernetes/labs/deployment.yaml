apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-native-test-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-native-test-platform

  template:
    metadata:
      labels:
        app: cloud-native-test-platform

    spec:
      containers:
        - name: cloud-native-test-platform
          image: 825765413460.dkr.ecr.ap-south-1.amazonaws.com/cloud-native-test-platform:38ff62e

          ports:
            - containerPort: 8000

          env:
            - name: APP_ENV
              value: "kubernetes"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
