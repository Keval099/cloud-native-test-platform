name: CI - Python Tests and Docker Build

on:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -f docker/labs/Dockerfile -t cloud-native-test-platform:ci .

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image cloud-native-test-platform:ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::825765413460:role/GitHubActions-ECR-CloudNativeTestPlatform
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 |
          docker login --username AWS --password-stdin \
            825765413460.dkr.ecr.ap-south-1.amazonaws.com
