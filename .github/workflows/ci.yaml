name: CI - Python Tests and Docker Build

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -f docker/labs/Dockerfile -t cloud-native-test-platform:${IMAGE_TAG} .

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image cloud-native-test-platform:${IMAGE_TAG}

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::825765413460:role/GitHubActions-ECR-CloudNativeTestPlatform
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecr get-login-password --region ap-south-1 |
          docker login --username AWS --password-stdin \
            825765413460.dkr.ecr.ap-south-1.amazonaws.com

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag cloud-native-test-platform:${IMAGE_TAG} \
            825765413460.dkr.ecr.ap-south-1.amazonaws.com/cloud-native-test-platform:${IMAGE_TAG}

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push 825765413460.dkr.ecr.ap-south-1.amazonaws.com/cloud-native-test-platform:${IMAGE_TAG}

      - name: Configure AWS credentials for EKS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::825765413460:role/GitHubActions-EKS-CloudNativeTestPlatform
          aws-region: ap-south-1

      - name: Update kubeconfig
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name cloud-native-test-platform

      - name: Deploy application to EKS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl set image deployment/cloud-native-test-platform \
            cloud-native-test-platform=825765413460.dkr.ecr.ap-south-1.amazonaws.com/cloud-native-test-platform:${IMAGE_TAG}

      - name: Wait for deployment rollout
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl rollout status deployment/cloud-native-test-platform \
            --timeout=180s

      - name: Verify application pods
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          kubectl get pods -o wide
